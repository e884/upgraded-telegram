<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCCU 面試題庫</title>
<style>
  :root {
    --bg: #1e1e1e;
    --bg2: #262626;
    --hover: #2f2f2f;
    --border: #363636;
    --text: #dadada;
    --muted: #999999;
    --faint: #666666;
    --green: #34C759;
    --nccu-blue: #23417D;
    --nccu-blue-edge: #3059AB;
    --link: #A7BCE6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    font-size: 14px;
    display: grid;
    grid-template-columns: 400px 1fr;
    grid-template-rows: 44px 1fr;
    grid-template-areas: "panel header" "panel graph";
    overflow: hidden;
  }
  button { font: inherit; }

  #panel { grid-area: panel; background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 8px 24px 40px; }
  .section { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: none; }
  .section-title { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar { display: flex; }
  .bar > span { display: block; height: 100%; width: 0; transition: width .25s ease; }
  .legend { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  .qhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .qid { font-size: 18px; font-weight: 600; line-height: 1.4; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 2px 9px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .qtext { font-size: 16px; line-height: 1.6; margin-top: 10px; }
  .empty { color: var(--muted); line-height: 1.6; }

  .check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .check input { position: absolute; opacity: 0; width: 0; height: 0; }
  .check .box { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--faint); background: var(--bg2); display: grid; place-items: center; transition: background .15s, border-color .15s; }
  .check .box svg { opacity: 0; }
  .check input:checked + .box { background: var(--conf, var(--green)); border-color: var(--conf, var(--green)); }
  .conf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
  .conf button { border: 1px solid var(--border); background: var(--border); color: var(--muted); border-radius: 6px; padding: 6px 0; cursor: pointer; }
  .conf button:hover { filter: brightness(1.2); }
  .conf button.active { color: #10301a; font-weight: 600; }
  .check input:checked + .box svg { opacity: 1; }
  .check input:focus-visible + .box { outline: 2px solid var(--link); outline-offset: 2px; }

  textarea { width: 100%; min-height: 130px; margin-top: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; resize: vertical; font: inherit; line-height: 1.6; }
  textarea:focus { outline: none; border-color: var(--nccu-blue-edge); }
  .answer-view { margin-top: 12px; white-space: pre-wrap; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; line-height: 1.6; }
  .actions { display: flex; justify-content: flex-end; margin-top: 10px; }
  .btn { border-radius: 6px; padding: 6px 16px; cursor: pointer; border: 1px solid var(--border); background: var(--border); color: var(--text); }
  .btn.primary { background: var(--nccu-blue); border-color: var(--nccu-blue-edge); color: #fff; font-weight: 600; }
  .btn:hover { filter: brightness(1.15); }

  .pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .pill { text-align: center; padding: 6px 0; border-radius: 6px; background: var(--border); color: var(--muted); }
  .pill.active { background: var(--nccu-blue); color: #fff; font-weight: 600; }

  .group-title { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; margin: 12px 0 6px; }
  .group-title:first-of-type { margin-top: 0; }
  .line { width: 28px; border-top: 2px solid var(--text); }
  .line.dotted { border-top-style: dotted; }
  a.conn { display: grid; grid-template-columns: 16px 1fr; gap: 6px; align-items: baseline; padding: 4px 6px; border-radius: 4px; text-decoration: none; color: #b3b3b3; }
  a.conn:hover { background: var(--hover); }
  .arrow { color: var(--muted); }
  .cid { color: var(--link); font-weight: 600; }
  .ctext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .none { color: var(--faint); padding: 2px 6px; }

  header { grid-area: header; display: flex; align-items: center; gap: 6px; padding: 0 12px; position: relative; }
  .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; border: none; background: transparent; color: var(--muted); cursor: pointer; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .title { position: absolute; left: 50%; transform: translateX(-50%); color: var(--muted); pointer-events: none; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; background: var(--border); border-radius: 6px; padding: 3px; gap: 2px; }
  .seg button { border: none; background: transparent; color: var(--muted); border-radius: 4px; padding: 3px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--nccu-blue); color: #fff; font-weight: 600; }
  .switch { display: inline-flex; align-items: center; gap: 8px; border: none; background: transparent; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 6px; margin-left: 6px; }
  .switch:hover { background: var(--hover); }
  .track { width: 34px; height: 20px; border-radius: 10px; background: var(--border); position: relative; transition: background .15s; }
  .knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #c8c8c8; transition: transform .15s; }
  .switch[aria-pressed="true"] .track { background: var(--green); }
  .switch[aria-pressed="true"] .knob { transform: translateX(14px); background: #fff; }
  .switch[aria-pressed="true"] { color: var(--text); }

  #graphWrap { grid-area: graph; position: relative; overflow: hidden; }
  #graph { display: block; width: 100%; height: 100%; cursor: grab; }
  #graph.dragging { cursor: grabbing; }
  #graph.on-node { cursor: pointer; }
  #status { position: absolute; right: 0; bottom: 0; background: var(--bg2); color: var(--muted); font-size: 12px; padding: 5px 12px; border-top-left-radius: 6px; display: flex; align-items: center; gap: 8px; }
  #status .dot { width: 7px; height: 7px; }
</style>
</head>
<body>
  <aside id="panel" aria-live="polite"></aside>

  <header>
    <button class="icon-btn" id="back" aria-label="Back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button class="icon-btn" id="forward" aria-label="Forward">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
    <span class="title" id="viewTitle"></span>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="zh" aria-pressed="true">中</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="switch" id="completedToggle" aria-pressed="true">
      <span class="track"><span class="knob"></span></span>
      <span id="completedLabel"></span>
    </button>
  </header>

  <main id="graphWrap">
    <canvas id="graph" aria-label="Question graph"></canvas>
    <div id="status"><span class="dot" id="statusDot"></span><span id="statusText"></span></div>
  </main>

<script>
/* ---------- Data: edit questions and links here ---------- */
const SECTIONS = {

  I: { zh: "聊天與挑戰",     en: "Chat & pushback",    color: "#3059AB" },
};
const SECTION_ANGLE = { F: 90, E: 45, G: 0, I: -45, H: -90, C: -135, D: 180, B: 135 };

// id | level (q = Quick, m = Medium, d = Deep) | 中文 | English
const QUESTIONS_RAW = `
A1|q|一分鐘自我介紹|One-minute self-introduction.
B1|q|你幾歲開始做史萊姆影片？為什麼開始？|How old were you when you started making slime videos? Why did you start?
B2|m|76萬觀看的教學影片在教什麼？為什麼會紅？|What does your 760,000-view tutorial teach, and why did it take off?
B4|q|《捏捏做失敗怎麼辦？》51.4萬觀看，捏捏和史萊姆有什麼不同？|Your video "What if your squishy fails?" got 514,000 views. How are squishies different from slime?

B7|d|你怎麼判斷一支影片成功？只看觀看數嗎？|How do you judge whether a video is successful? Only by views?
B8|m|你說會依內容目的選擇呈現方式，什麼時候用教學、什麼時候用 ASMR？|You said you choose how to present content based on its purpose. When do you use a tutorial, and when ASMR?

B13|m|線上買史萊姆摸不到，你怎麼讓顧客知道手感？|People buying slime online can't touch it. How do you let customers know how it feels?
B15|m|當年的經驗怎麼影響你現在看兒童和短影音？|How does that experience shape the way you see children and short videos today?

C14|d|你的研究在問什麼讓人想買，但你也在教孩子，你怎麼看短影音對孩子的影響？|Your research asks what makes people want to buy, but you also teach children. How do you see short videos' effect on children?
D1|q|我看到你在富士軟片實習，平常都在忙什麼？|I see you're interning at FUJIFILM. What keeps you busy there?
D2|q|富士軟片？是做相機、底片的那個嗎？|FUJIFILM? The company that makes cameras and film?

E1|m|簡單介紹你的研究主題、理論架構和方法。|Briefly introduce your research topic, theoretical framework and method.
E2|q|計畫做到哪裡？做了什麼？|How far along is the project? What have you done so far?

E7|d|為什麼情感共鳴是中介，不是調節？|Why is emotional resonance a mediator rather than a moderator?
E8|d|AI 和人類廣告怎麼操弄？受試者看得出來嗎？|How do you manipulate AI versus human ads? Can participants tell the difference?
E9|d|受試者什麼時候知道是 AI 做的？|When do participants find out the ad was made by AI?
E10|d|你操弄的是標示，所以研究的是 AI 本身，還是人們對 AI 的印象？|You're manipulating a label, so are you studying AI itself, or people's impression of AI?

E14|m|Z 世代怎麼定義？受試者從哪裡找？|How do you define Gen Z, and where do your participants come from?
E16|m|為什麼要加深度訪談？量化不夠嗎？|Why add in-depth interviews? Isn't the quantitative part enough?

/* ---------- Model ---------- */
const QUESTIONS = QUESTIONS_RAW.trim().split("\n").map(line => {
  const [id, level, zh, en] = line.split("|");
  return { id, level, zh, en, section: id[0] };
});
const byId = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
for (const line of SUBTITLES_RAW.trim().split("\n")) {
  const [id, zh, en] = line.split("|");
  if (byId[id]) byId[id].title = { zh, en }; else console.error("Subtitle for an unknown question:", id);
}
for (const q of QUESTIONS) if (!q.title) { console.error("Missing subtitle:", q.id); q.title = { zh: q.id, en: q.id }; }
const parseLinks = raw => raw.trim().split(/\s+/).map(e => e.split(">"));
const DIRECT = parseLinks(DIRECT_RAW);
const INDIRECT = parseLinks(INDIRECT_RAW);
for (const [a, b] of [...DIRECT, ...INDIRECT]) {
  if (!byId[a] || !byId[b]) console.error("Link to an unknown question:", a, b);
}
const rel = Object.fromEntries(QUESTIONS.map(q => [q.id, { parents: [], children: [], out: [], in: [], neighbors: new Set() }]));
for (const [a, b] of DIRECT) { rel[a].children.push(b); rel[b].parents.push(a); rel[a].neighbors.add(b); rel[b].neighbors.add(a); }
for (const [a, b] of INDIRECT) { rel[a].out.push(b); rel[b].in.push(a); rel[a].neighbors.add(b); rel[b].neighbors.add(a); }
const EDGES = [];
const edgeKey = new Set();
for (const [a, b] of DIRECT) { EDGES.push({ a, b, kind: "direct" }); edgeKey.add([a, b].sort().join("|")); }
for (const [a, b] of INDIRECT) {
  const k = [a, b].sort().join("|");
  if (!edgeKey.has(k)) { EDGES.push({ a, b, kind: "indirect" }); edgeKey.add(k); }
}
const sectionCount = {};
for (const q of QUESTIONS) sectionCount[q.section] = (sectionCount[q.section] || 0) + 1;

/* ---------- Saved state (this computer only) ---------- */
const KEY = "nccu-interview-graph-v1";
let storageOk = true;
let state = { lang: "zh", showCompleted: true, done: {}, answers: {}, conf: {} };
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && typeof saved === "object") state = { ...state, ...saved, done: saved.done || {}, answers: saved.answers || {}, conf: saved.conf || {} };
} catch { storageOk = false; }
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
  catch { storageOk = false; }
  renderStatus();
}
const t = () => T[state.lang];
const qText = q => q[state.lang];
const qTitle = q => q.title[state.lang];
const doneCount = () => QUESTIONS.filter(q => state.done[q.id]).length;
// Confidence: 3 = confident (vibrant apple green), 2 = okay, 1 = shaky (lightest green)
const CONF_COLOR = { 3: "#34C759", 2: "#8FE0A4", 1: "#D2F5DB" };
const confOf = id => state.conf[id] || 2;

/* ---------- Routing: #/q/ID ---------- */
let selected = null;
let editing = false;
let draft = null;
function routeId() {
  const m = location.hash.match(/^#\/q\/([A-Za-z]\d+)$/);
  const id = m && m[1].toUpperCase();
  return id && byId[id] ? id : null;
}
function onRoute() {
  selected = routeId();
  editing = selected ? !state.answers[selected] : false;
  draft = null;
  document.title = selected ? `${qTitle(byId[selected])} · ${t().pageTitle}` : t().pageTitle;
  renderPanel();
  if (selected) ensureVisible(selected);
  dirty = true;
}
window.addEventListener("hashchange", onRoute);

document.getElementById("forward").onclick = () => history.forward();

const panel = document.getElementById("panel");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CHECK_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#10301a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

function connRow(arrow, id) {
  const q = byId[id];
  return `<a class="conn" href="#/q/${id}" title="${esc(qText(q))}"><span class="arrow">${arrow}</span><span class="cid ctext">${esc(qTitle(q))}</span></a>`;
}
function renderPanel() {
  const L = t();
  const openBox = document.getElementById("answerBox");
  if (openBox && openBox.dataset.id === selected) draft = openBox.value;
  const n = doneCount();
  const byConf = { 1: 0, 2: 0, 3: 0 };
  for (const q of QUESTIONS) if (state.done[q.id]) byConf[confOf(q.id)]++;
  let html = `
    <div class="section">
      <div class="row"><span class="section-title" style="margin:0">${L.progress}</span><span>${n} / ${QUESTIONS.length}</span></div>
      <div class="bar">${[3, 2, 1].map(c => `<span style="width:${(byConf[c] / QUESTIONS.length * 100).toFixed(2)}%;background:${CONF_COLOR[c]}"></span>`).join("")}</div>
      <div class="legend">${[3, 2, 1].map(c => `<span><span class="dot" style="background:${CONF_COLOR[c]}"></span>${L.confLevels[c]} ${byConf[c]}</span>`).join("")}</div>
    </div>`;
  if (!selected) {
    panel.innerHTML = html + `<div class="section"><div class="empty">${L.empty}</div></div>`;
    return;
  }
  const q = byId[selected];
  const sec = SECTIONS[q.section];
  const r = rel[selected];
  const answer = state.answers[selected] || "";
  const directRows = [...r.parents.map(id => connRow("↑", id)), ...r.children.map(id => connRow("↓", id))].join("") || `<div class="none">${L.none}</div>`;
  const indirectRows = [...r.out.map(id => connRow("→", id)), ...r.in.map(id => connRow("←", id))].join("") || `<div class="none">${L.none}</div>`;
  html += `
    <div class="section">
      <div class="section-title">${L.question}</div>
      <div class="qhead">
        <span class="qid">${esc(qTitle(q))}</span>
        <span class="chip"><span class="dot" style="background:${sec.color}"></span>${sec[state.lang]}</span>
      </div>
      <div class="qtext">${esc(qText(q))}</div>
    </div>
    <div class="section">
      <div class="section-title">${L.completion}</div>
      <label class="check" style="--conf:${CONF_COLOR[confOf(selected)]}"><input type="checkbox" id="doneBox" ${state.done[selected] ? "checked" : ""}><span class="box">${CHECK_SVG}</span><span>${L.answered}</span></label>
      <div class="conf">${[1, 2, 3].map(c => {
        const on = state.done[selected] && confOf(selected) === c;
        return `<button data-conf="${c}" class="${on ? "active" : ""}" style="${on ? `background:${CONF_COLOR[c]};border-color:${CONF_COLOR[c]}` : ""}">${L.confLevels[c]}</button>`;
      }).join("")}</div>
      ${editing
        ? `<textarea id="answerBox" data-id="${selected}" placeholder="${L.placeholder}">${esc(draft ?? answer)}</textarea>
           <div class="actions"><button class="btn primary" id="saveBtn">${L.save}</button></div>`
        : `<div class="answer-view">${esc(answer)}</div>
           <div class="actions"><button class="btn" id="editBtn">${L.edit}</button></div>`}
    </div>
    <div class="section">
      <div class="section-title">${L.depth}</div>
      <div class="pills">${["q", "m", "d"].map(l => `<div class="pill ${q.level === l ? "active" : ""}">${L.levels[l]}</div>`).join("")}</div>
    </div>
    <div class="section">
      <div class="section-title">${L.connections}</div>
      <div class="group-title"><span class="line"></span>${L.direct}</div>
      ${directRows}
      <div class="group-title"><span class="line dotted"></span>${L.indirect}</div>
      ${indirectRows}
    </div>`;
  panel.innerHTML = html;

  document.getElementById("doneBox").onchange = e => {
    if (e.target.checked) state.done[selected] = true; else { delete state.done[selected]; delete state.conf[selected]; }
    persist(); renderPanel(); dirty = true;
  };
  panel.querySelectorAll(".conf button").forEach(b => b.onclick = () => {
    state.done[selected] = true;
    state.conf[selected] = Number(b.dataset.conf);
    persist(); renderPanel(); dirty = true;
  });
  const saveBtn = document.getElementById("saveBtn");
  if (saveBtn) saveBtn.onclick = () => {
    const v = document.getElementById("answerBox").value.trim();
    if (v) { state.answers[selected] = v; editing = false; } else { delete state.answers[selected]; }
    draft = null;
    persist(); renderPanel();
  };
  const editBtn = document.getElementById("editBtn");
  if (editBtn) editBtn.onclick = () => {
    editing = true; draft = null; renderPanel();
    const box = document.getElementById("answerBox");
    box.focus(); box.setSelectionRange(box.value.length, box.value.length);
  };
}

let dirty = true;

const CENTER = { A: { x: 0, y: 0 } };
for (const [s, deg] of Object.entries(SECTION_ANGLE)) {
  const a = deg * Math.PI / 180;
  CENTER[s] = { x: Math.cos(a) * 380, y: -Math.sin(a) * 300 };
}
const PHYS = { repel: 200, cluster: 0.14, directDist: 55, directK: 0.12, indirectDist: 150, indirectK: 0.002, collide: 18 };
let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const nodes = QUESTIONS.map(q => {
  const c = CENTER[q.section];
  const deg = rel[q.id].neighbors.size;
  return { id: q.id, s: q.section, x: c.x + (rand() - 0.5) * 80, y: c.y + (rand() - 0.5) * 80, vx: 0, vy: 0,
           r: q.id === "A1" ? 13 : 6 + Math.sqrt(deg) * 1.8, fixed: q.id === "A1" };
});
const N = Object.fromEntries(nodes.map(n => [n.id, n]));
const links = EDGES.map(e => ({ ...e, s: N[e.a], t: N[e.b] }));

let alpha = 1;
function tick() {
  alpha *= 0.985;
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = rand() - 0.5; dy = rand() - 0.5; d2 = 1; }
      const f = PHYS.repel * alpha / d2;
      a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
      const minD = a.r + b.r + PHYS.collide;
      if (d2 < minD * minD) {
        const d = Math.sqrt(d2), push = (minD - d) / d * 0.5;
        a.vx -= dx * push; a.vy -= dy * push; b.vx += dx * push; b.vy += dy * push;
      }
    }
  }
  for (const l of links) {
    const dist = l.kind === "direct" ? PHYS.directDist : PHYS.indirectDist;
    const k = l.kind === "direct" ? PHYS.directK : PHYS.indirectK;
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = (d - dist) / d * alpha * k;
    l.s.vx += dx * f; l.s.vy += dy * f; l.t.vx -= dx * f; l.t.vy -= dy * f;
  }
  for (const n of nodes) {
    const c = CENTER[n.s];
    n.vx += (c.x - n.x) * PHYS.cluster * alpha;
    n.vy += (c.y - n.y) * PHYS.cluster * alpha;
    if (n.fixed || n.pinned) { n.vx = 0; n.vy = 0; continue; }
    n.vx *= 0.6; n.vy *= 0.6;
    n.x += n.vx; n.y += n.vy;
  }
}
for (let i = 0; i < 400; i++) tick();
alpha = 0;

/* ---------- Graph: view ---------- */
const visible = n => state.showCompleted || !state.done[n.id];
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  dirty = true;
}
function fit() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
  const pad = 90;
  view.k = Math.min((W - pad * 2) / (x1 - x0), (H - pad * 2) / (y1 - y0), 2);
  view.x = W / 2 - (x0 + x1) / 2 * view.k;
  view.y = H / 2 - (y0 + y1) / 2 * view.k;
  dirty = true;
}
function ensureVisible(id) {
  const n = N[id];
  if (!n || !W) return;
  const sx = n.x * view.k + view.x, sy = n.y * view.k + view.y;
  if (sx < 60 || sx > W - 60 || sy < 60 || sy > H - 60) {
    view.x = W / 2 - n.x * view.k; view.y = H / 2 - n.y * view.k; dirty = true;
  }
}
const toWorld = (sx, sy) => ({ x: (sx - view.x) / view.k, y: (sy - view.y) / view.k });
function nodeAt(sx, sy) {
  const p = toWorld(sx, sy);
  let best = null, bestD = Infinity;
  for (const n of nodes) {
    if (!visible(n)) continue;
    const d = Math.hypot(n.x - p.x, n.y - p.y);
    if (d < n.r + 6 / view.k && d < bestD) { best = n; bestD = d; }
  }
  return best;
}

/* ---------- Graph: drawing ---------- */
let hover = null;
function draw() {
  const L = t();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.translate(view.x, view.y);
  ctx.scale(view.k, view.k);
  const k = view.k;
  const focus = hover ? hover.id : selected;
  const focusSet = focus ? new Set([focus, ...rel[focus].neighbors]) : null;

  for (const l of links) {
    if (!visible(l.s) || !visible(l.t)) continue;
    const hl = focus && (l.a === focus || l.b === focus);
    ctx.beginPath();
    ctx.moveTo(l.s.x, l.s.y); ctx.lineTo(l.t.x, l.t.y);
    ctx.setLineDash(l.kind === "indirect" ? [2 / k, 4 / k] : []);
    ctx.lineWidth = (hl ? 1.8 : 1) / k;
    ctx.strokeStyle = hl ? "#A7BCE6" : (focusSet ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.16)");
    ctx.stroke();
  }
  ctx.setLineDash([]);

  for (const n of nodes) {
    if (!visible(n)) continue;
    const dim = focusSet && !focusSet.has(n.id);
    ctx.globalAlpha = dim ? 0.22 : 1;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fillStyle = state.done[n.id] ? CONF_COLOR[confOf(n.id)] : SECTIONS[n.s].color; ctx.fill();
    if (n.id === selected) {
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 6 / k, 0, Math.PI * 2);
      ctx.lineWidth = 2 / k; ctx.strokeStyle = "#ffffff"; ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  const FONT = `Inter, "PingFang TC", "Microsoft JhengHei", sans-serif`;
  const placed = [];

  // Section labels sit just outside each cluster; their space is reserved first.
  const sectionLabels = [];
  ctx.font = `600 ${13 / k}px ${FONT}`;
  for (const s of Object.keys(SECTION_ANGLE)) {
    const members = nodes.filter(n => n.s === s && visible(n));
    if (!members.length) continue;
    const cx = members.reduce((v, n) => v + n.x, 0) / members.length;
    const cy = members.reduce((v, n) => v + n.y, 0) / members.length;
    const len = Math.hypot(cx, cy) || 1;
    const ux = cx / len, uy = cy / len;
    const reach = Math.max(...members.map(n => (n.x - cx) * ux + (n.y - cy) * uy + n.r));
    const off = reach + (Math.abs(uy) > 0.7 ? 22 : 30) / k + Math.abs(ux) * 40 / k;
    const text = `${SECTIONS[s][state.lang]} · ${sectionCount[s]}`;
    const x = cx + ux * off, y = cy + uy * off;
    const w = ctx.measureText(text).width, h = 16 / k;
    sectionLabels.push({ text, x, y, color: SECTIONS[s].color });
    placed.push({ x: x - w / 2, y: y - h / 2, w, h });
  }

  // Nodes also block labels, so a subtitle never covers another question's dot.
  for (const n of nodes) if (visible(n)) placed.push({ x: n.x - n.r - 1 / k, y: n.y - n.r - 1 / k, w: 2 * n.r + 2 / k, h: 2 * n.r + 2 / k });

  // Subtitle labels: focused ones first, each moved to a free spot so none overlap.
  const labelAlpha = Math.max(0, Math.min(1, (k - 0.4) / 0.3));
  const rank = n => n.id === focus ? 3 : (focusSet && focusSet.has(n.id) ? 2 : 1);
  const hits = r => placed.some(p => r.x < p.x + p.w && r.x + r.w > p.x && r.y < p.y + p.h && r.y + r.h > p.y);
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  for (const n of nodes.filter(visible).sort((a, b) => rank(b) - rank(a))) {
    const strong = focusSet && focusSet.has(n.id);
    const a = strong ? 1 : (focusSet ? labelAlpha * 0.3 : labelAlpha * 0.7);
    if (a <= 0.02) continue;
    const size = (strong ? 12 : 10.5) / k;
    ctx.font = `${size}px ${FONT}`;
    const text = qTitle(byId[n.id]);
    const w = ctx.measureText(text).width, h = size * 1.3, gap = 4 / k;
    const spots = [
      { x: n.x - w / 2, y: n.y + n.r + gap },
      { x: n.x - w / 2, y: n.y - n.r - gap - h },
      { x: n.x + n.r + gap, y: n.y - h / 2 },
      { x: n.x - n.r - gap - w, y: n.y - h / 2 },
    ];
    if (strong) for (let i = 1; i <= 3; i++) {
      spots.push({ x: n.x - w / 2, y: n.y + n.r + gap + i * h }, { x: n.x - w / 2, y: n.y - n.r - gap - (i + 1) * h });
    }
    let spot = spots.find(c => !hits({ ...c, w, h }));
    if (!spot) { if (!strong) continue; spot = spots[0]; }
    placed.push({ ...spot, w, h });
    ctx.globalAlpha = a;
    if (strong) {
      ctx.fillStyle = "rgba(30,30,30,0.8)";
      ctx.fillRect(spot.x - 3 / k, spot.y - 1 / k, w + 6 / k, h + 1 / k);
    }
    ctx.fillStyle = strong ? "#dadada" : "#b3b3b3";
    ctx.fillText(text, spot.x, spot.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "center";

  ctx.font = `600 ${13 / k}px ${FONT}`;
  ctx.textBaseline = "middle";
  for (const l of sectionLabels) {
    ctx.globalAlpha = focusSet ? 0.45 : 0.95;
    ctx.fillStyle = l.color;
    ctx.fillText(l.text, l.x, l.y);
  }
  ctx.globalAlpha = 1;
}

/* ---------- Graph: interaction ---------- */
let drag = null;
canvas.addEventListener("pointerdown", e => {
  const n = nodeAt(e.offsetX, e.offsetY);
  drag = { node: n, sx: e.offsetX, sy: e.offsetY, vx: view.x, vy: view.y, moved: false };
  canvas.setPointerCapture(e.pointerId);
  if (!n) canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", e => {
  if (drag) {
    const dx = e.offsetX - drag.sx, dy = e.offsetY - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    if (drag.node) {
      if (drag.moved && !drag.node.fixed) {
        const p = toWorld(e.offsetX, e.offsetY);
        drag.node.pinned = true;
        drag.node.x = p.x; drag.node.y = p.y; drag.node.vx = 0; drag.node.vy = 0;
        alpha = Math.max(alpha, 0.25);
      }
    } else {
      view.x = drag.vx + dx; view.y = drag.vy + dy;
    }
    dirty = true;
    return;
  }
  const n = nodeAt(e.offsetX, e.offsetY);
  if (n !== hover) { hover = n; dirty = true; }
  canvas.classList.toggle("on-node", !!n);
});
canvas.addEventListener("pointerup", () => {
  if (drag && drag.node && !drag.moved) location.hash = `#/q/${drag.node.id}`;
  if (drag && drag.node) drag.node.pinned = false;
  drag = null;
  canvas.classList.remove("dragging");
});
canvas.addEventListener("pointerleave", () => { if (!drag && hover) { hover = null; dirty = true; } });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const k = Math.max(0.25, Math.min(4, view.k * Math.exp(-e.deltaY * 0.0015)));
  const p = toWorld(e.offsetX, e.offsetY);
  view.k = k; view.x = e.offsetX - p.x * k; view.y = e.offsetY - p.y * k;
  dirty = true;
}, { passive: false });

/* ---------- Start ---------- */
new ResizeObserver(() => { const first = !W; resize(); if (first) fit(); }).observe(wrap);
function frame() {
  if (alpha > 0.005) { tick(); dirty = true; }
  if (dirty) { draw(); dirty = false; }
  requestAnimationFrame(frame);
}
renderHeader();
renderStatus();
onRoute();
requestAnimationFrame(frame);
</script>
</body>
</html>
